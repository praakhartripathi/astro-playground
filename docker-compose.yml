services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Target the 'builder' stage for development, which has Node.js and dependencies
      target: builder
    image: astro-playground-frontend
    container_name: astro-playground-frontend
    ports:
      # Expose Vite's default port for HMR
      - "5173:5173"
    restart: unless-stopped
    # Mount the source code for hot reloading
    volumes:
      - ./frontend:/app
      # Use a named volume for node_modules to persist them and avoid overwriting by the host mount.
      - frontend_node_modules:/app/node_modules
    # Override the default Dockerfile CMD to run the dev server
    command: npm run dev -- --host

volumes:
  frontend_node_modules: