server {
    # The nginx-unprivileged image listens on port 8080 by default
    listen 8080;
    server_name localhost;

    # Root directory for the static files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is the key to making client-side routing work with Nginx.
        # It tries to find the file, then a directory, and if it fails,
        # it falls back to serving /index.html.
        try_files $uri $uri/ /index.html;
    }
}